<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D球形分组点名器</title>
<style>
  /* ============ 全局基础 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    color: #e8eefc;
    user-select: none;
  }
  #scene { position: fixed; inset: 0; display: block; }

  /* ============ 左侧控制面板（毛玻璃） ============ */
  #panel {
    position: fixed; top: 20px; left: 20px; bottom: 20px;
    width: 230px;
    padding: 20px;
    border-radius: 18px;
    background: rgba(20, 30, 60, 0.45);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(120, 160, 255, 0.18);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 10;
  }
  #panel.hidden-ui { opacity: 0; pointer-events: none; transform: translateX(-20px); }

  #panel h1 {
    font-size: 18px; font-weight: 600; letter-spacing: 1px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #9ec5ff, #e0d4ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  /* 面板关闭按钮 */
  #btnClosePanel {
    position: absolute; top: 14px; right: 14px;
    width: 26px; height: 26px; border-radius: 8px;
    background: transparent; border: none;
    color: #8ea2cc; font-size: 14px; cursor: pointer;
    transition: all 0.2s;
  }
  #btnClosePanel:hover { background: rgba(120,160,255,0.15); color: #fff; }
  /* 面板刷新（重置名单缓存）按钮 */
  #btnResetCache {
    position: absolute; top: 14px; right: 46px;
    width: 26px; height: 26px; border-radius: 8px;
    background: transparent; border: none;
    color: #8ea2cc; font-size: 16px; line-height: 1; cursor: pointer;
    transition: all 0.2s;
  }
  #btnResetCache:hover { background: rgba(120,160,255,0.15); color: #fff; transform: rotate(180deg); }
  /* 左上角展开按钮 */
  #btnOpenPanel {
    position: fixed; top: 20px; left: 20px; z-index: 11;
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(20, 30, 60, 0.45);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(120, 160, 255, 0.2);
    color: #cfe0ff; font-size: 18px; cursor: pointer;
    transition: all 0.2s;
  }
  #btnOpenPanel:hover { background: rgba(90, 140, 255, 0.25); }
  #panel .sub { font-size: 12px; color: #7d8db5; margin-bottom: 16px; }

  .panel-btns { display: flex; gap: 8px; margin-bottom: 14px; }
  .panel-btns button {
    flex: 1; padding: 8px 0; font-size: 12px;
    border-radius: 10px; cursor: pointer;
    background: rgba(120, 160, 255, 0.12);
    color: #cfe0ff; border: 1px solid rgba(120, 160, 255, 0.25);
    transition: all 0.2s;
  }
  .panel-btns button:hover { background: rgba(120, 160, 255, 0.25); }
  .panel-btns button:disabled { opacity: 0.4; cursor: not-allowed; }

  #groupList {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
    padding-right: 4px;
  }
  #groupList::-webkit-scrollbar { width: 4px; }
  #groupList::-webkit-scrollbar-thumb { background: rgba(120,160,255,0.3); border-radius: 2px; }

  .group-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
  }
  .group-item:hover { background: rgba(120,160,255,0.08); }
  .group-item.active {
    background: rgba(90, 140, 255, 0.18);
    border-color: rgba(120, 170, 255, 0.5);
  }
  .group-item input[type="radio"] { accent-color: #6ea8ff; cursor: pointer; }
  .group-item .gname { flex: 1; }
  .group-item .gcount { font-size: 12px; color: #8ea2cc; }
  .group-item.active .gcount { color: #b8d4ff; }

  .options {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid rgba(120,160,255,0.15);
    font-size: 13px;
  }
  .options label {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; color: #c8d6f5;
    margin-bottom: 10px;
  }
  .options input[type="checkbox"] { accent-color: #6ea8ff; }
  .options .reset-btn {
    width: 100%; padding: 7px; font-size: 12px;
    border-radius: 8px; cursor: pointer;
    background: transparent; color: #9fb4e0;
    border: 1px solid rgba(120,160,255,0.2);
  }
  .options .reset-btn:hover { background: rgba(120,160,255,0.1); }

  /* ============ 底部抽签区 ============ */
  #bottom {
    position: fixed; left: 0; right: 0; bottom: 30px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    z-index: 5;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #bottom.hidden-ui { opacity: 0; pointer-events: none; transform: translateY(20px); }

  #winner { display: none; }

  #drawBtn {
    padding: 16px 80px;
    font-size: 22px; font-weight: 500; letter-spacing: 8px;
    color: #e8eefc; cursor: pointer;
    background: rgba(40, 60, 100, 0.35);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(140, 170, 220, 0.3);
    border-radius: 50px;
    box-shadow: 0 4px 24px rgba(60, 100, 180, 0.2), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: all 0.25s;
  }
  #drawBtn:hover {
    background: rgba(60, 90, 140, 0.45);
    border-color: rgba(160, 190, 240, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(60, 100, 180, 0.3);
  }
  #drawBtn:active { transform: translateY(0); }
  #drawBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ============ 右上角工具按钮 ============ */
  #topRight {
    position: fixed; top: 20px; right: 20px; z-index: 10;
    display: flex; gap: 10px;
    transition: opacity 0.4s ease;
  }
  #topRight.hidden-ui { opacity: 0; pointer-events: none; }
  #topRight button {
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    background: rgba(20, 30, 60, 0.45);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(120, 160, 255, 0.2);
    color: #cfe0ff; font-size: 16px;
    transition: all 0.2s;
  }
  #topRight button:hover { background: rgba(90, 140, 255, 0.25); }

  /* ============ 编辑弹窗 ============ */
  #modalMask {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
  }
  #modalMask.show { display: flex; }
  #modal {
    width: 520px; max-width: 92vw; max-height: 86vh;
    padding: 24px;
    border-radius: 18px;
    background: rgba(25, 35, 70, 0.92);
    border: 1px solid rgba(120, 160, 255, 0.25);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 12px;
  }
  #modal h2 { font-size: 18px; font-weight: 600; }
  #modal .hint { font-size: 12px; color: #8ea2cc; }
  #groupNameInput {
    padding: 10px 14px; font-size: 14px;
    border-radius: 10px; border: 1px solid rgba(120,160,255,0.3);
    background: rgba(0,0,0,0.25); color: #fff; outline: none;
  }
  #groupNameInput:focus { border-color: #6ea8ff; }
  #namesTextarea {
    flex: 1; min-height: 280px;
    padding: 12px 14px; font-size: 14px; line-height: 1.7;
    border-radius: 10px; border: 1px solid rgba(120,160,255,0.3);
    background: rgba(0,0,0,0.25); color: #e8eefc;
    outline: none; resize: vertical;
    font-family: inherit;
  }
  #namesTextarea:focus { border-color: #6ea8ff; }
  #modal .countLine { font-size: 12px; color: #8ea2cc; }
  #modal .btns { display: flex; gap: 10px; justify-content: flex-end; }
  #modal .btns button {
    padding: 10px 24px; font-size: 14px; border-radius: 10px; cursor: pointer;
    border: none; transition: all 0.2s;
  }
  #cancelBtn { background: rgba(255,255,255,0.1); color: #cfe0ff; }
  #saveBtn { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; }
  #modal .btns button:hover { opacity: 0.9; }

  /* ============ 提示 toast ============ */
  #toast {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    padding: 10px 24px; border-radius: 30px;
    background: rgba(20,30,60,0.8); backdrop-filter: blur(10px);
    border: 1px solid rgba(120,160,255,0.3);
    font-size: 14px; color: #fff;
    opacity: 0; transition: opacity 0.3s;
    z-index: 200; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<!-- 左侧控制面板 -->
<div id="panel">
  <button id="btnResetCache" title="重置名单缓存并刷新">↻</button><button id="btnClosePanel" title="收起面板">✕</button>
  <h1>点名器</h1>
  <div class="sub">By Jenriamrk.吴汉东</div>
  <div class="panel-btns">
    <button id="btnNew">新建</button>
    <button id="btnEdit" disabled>编辑</button>
    <button id="btnDel" disabled>删除</button>
  </div>
  <div id="groupList"></div>
  <div class="options">
    <label><input type="checkbox" id="chkRemove" checked> 重复抽取</label>
    <button class="reset-btn" id="btnReset">重置本组（恢复全部人员）</button>
  </div>
</div>

<!-- 左上角：面板收起时的展开按钮 -->
<button id="btnOpenPanel" title="展开面板" style="display:none;">☰</button>

<!-- 右上角工具 -->
<div id="topRight">
  <button id="btnFullscreen" title="全屏">⛶</button>
</div>

<!-- 底部抽签区 -->
<div id="bottom">
  <div id="winner">?</div>
  <button id="drawBtn">开始抽签</button>
</div>

<!-- 编辑弹窗 -->
<div id="modalMask">
  <div id="modal">
    <h2 id="modalTitle">编辑名单组</h2>
    <div class="hint">一行一个名字，自动去除空行与首尾空格</div>
    <input type="text" id="groupNameInput" placeholder="名单组名称，例如：高一1班">
    <textarea id="namesTextarea" placeholder="张三&#10;李四&#10;王五&#10;赵六"></textarea>
    <div class="countLine" id="modalCount">共 0 人</div>
    <div class="btns">
      <button id="cancelBtn">取消</button>
      <button id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Three.js 经典全局版 CDN（r128，自带 OrbitControls） -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* =====================================================================
 * 3D 球形分组点名器
 *  - 名字以 Sprite(CanvasTexture) 形式贴在球面，文字始终朝向相机，清晰可读
 *  - 球体半透明深蓝 + Fresnel 外发光光晕
 *  - 星空由 ShaderMaterial 实现单颗星星独立闪烁
 *  - 分组数据持久化到 localStorage
 * ===================================================================== */

// -------------------- 数据层：localStorage --------------------
const STORAGE_KEY = 'draw3d_groups_v4';
const DATA_VERSION = 2; // 改示例数据时 bump 这个版本号，自动重置旧示例

/** 数据结构：
 * {
 *   groups: [{ id, name, names: [...], removed: [...] }],
 *   selectedId: 'xxx' | null
 * }
 */
let store = loadStore();

function loadStore() {
  // 内置班级数据（名单已按拼音字母排序）
  const class7 = ['敖庭熙','包骐硕','曹汉洋','曹诗莹','曹兆燚','柴哲瀚','陈俊楷','仇荣华','崔琳娜','邓嘉庆',
    '龚梓睿','胡思雨','黄艾宁','黄健伦','黄子康','黄子桐','黄紫怡','纪梦瑶','金琮博','雷文杰',
    '李牧泽','李万鹏','林向阳','刘寅昭','毛世航','毛昕祥','潘熠辰','彭子珊','尚裕胜','石昊辰',
    '王采薇','王静雯','王馨明','王钰鑫','王子诺','魏正旭','吴嘉豪','吴尚怡','谢汉林','谢紫玉',
    '熊浚凯','熊一诚','熊志鹏','许静姗','颜子康','叶松晞','尹建皓','余舒凡','余智辉','喻一桓',
    '张潇尹','张雨桐','张煜歆','张子瑶','钟梓萱','周子茹','朱飞宇'];
  const class3 = ['陈茗卓','陈晓雅','陈奕轩','程敏惠','宫玉涵','贺静怡','贺玉轩','怀瑞雪','蒋言可','李锦瑞',
    '李欣玥','梁傲旋','刘语澜','鲁雅楠','马玉淇','聂弘一','钱顺鑫','沈可馨','石清菡','石妤涵',
    '苏浩彬','孙梦琦','王梦妍','王芷妍','吴文琳','颜子涵','杨怡帆','张晶芳','张可馨','张岩莉',
    '张依楠','张紫妍','周雨瑄','朱幸好','左玥婷'];
  const class6 = ['艾书妍','曾庆彬','陈康睿','陈明哲','邓语馨','郝乘宇','何睿彤','胡云熙','黄俏川','贾烨欣',
    '焦展昆','金豫','李明昊','李思言','刘沛菡','刘瑞晨','刘宇博','刘宇泽','马睿萱','朋泳延',
    '彭湖湾','潜子游','施炜','宋坤轩','宋沛言','孙梓轩','汤惠子','童梓涵','汪书瑶','汪谢天',
    '汪彦希','汪子茗','汪子琪','王嘉馨','王俊灏','王茂源','王晓珊','魏俊童','魏若辰','向栋梁',
    '肖雅桐','徐安睿','徐翌轩','徐志伟','薛博然','晏字修','杨秋焱','喻京菁','张恒瑞','张睿哲',
    '张正阳','张智宸','张紫妍','赵连瑞','赵怡萌','周立言','邹昕灿'];
  const class11 = ['蔡俊鹏','陈昊天','陈孟宸','陈文静','陈永怡','程思雨','邓佳奇','邓炜玉','杜雨航','符宸浩',
    '付君浩','閤佳萱','閤启睿','顾万民','韩一辉','胡悦新','黄嘉乐','黄梓绮','姜睿鹏','蒋文博',
    '赖梓皓','李睿熙','李文轩','李妍心','刘城成','刘婉琳','刘欣烨','刘馨然','刘馨睿','刘子萌1',
    '刘子阳','卢梦瑶','罗希同','罗馨卓','裴晨宇','任蕊琪','邵娅妮','宋嘉乐','宋子浩','苏晓雯',
    '唐尔轩','唐子轩','陶赟希','汪天照','汪紫睿','王睿琦','王昱翔','王梓晗','魏思淼','魏紫萱',
    '吴浩园','吴梦瑶','夏琪轩','向澳帅','殷玉婷','余天慕','喻致洲','张珈源','张昕怡','张永琪',
    '章瑾秋','郑广涵','郑瀚杰','朱晏紫','邹佳航','邹子珊'];
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.groups)) {
        // v3：高一3班以内置 35 人名单为准；新增高一6班、高一11班
        if (s.version < 3) {
          const g3 = s.groups.find(g => g.id === 'g_class3');
          if (g3) {
            g3.names = class3.slice();
            g3.removed = (g3.removed || []).filter(n => class3.includes(n));
          }
          const addIfMissing = (id, name, names) => {
            if (!s.groups.find(g => g.id === id)) s.groups.push({ id: id, name: name, names: names.slice(), removed: [] });
          };
          addIfMissing('g_class6', '高一6班', class6);
          addIfMissing('g_class11', '高一11班', class11);
          s.version = 3;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        }
        // v4：班级列表按班级号排序（高一3班、高一6班、高一7班、高一11班）
        if (s.version < 4) {
          const classNum = (name) => parseInt(String(name).replace(/[^\d]/g, ''), 10) || 0;
          s.groups.sort((a, b) => classNum(a.name) - classNum(b.name));
          s.version = 4;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        }
        // v5：高一6班「张紫妍1」更名为「张紫妍」
        if (s.version < 5) {
          const g6 = s.groups.find(g => g.id === 'g_class6');
          if (g6) {
            g6.names = g6.names.map(n => n === '张紫妍1' ? '张紫妍' : n);
            g6.removed = (g6.removed || []).map(n => n === '张紫妍1' ? '张紫妍' : n);
          }
          s.version = 5;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        }
        // v6：四个内置班级名单按拼音字母排序
        if (s.version < 6) {
          const collator = new Intl.Collator('zh', { sensitivity: 'variant' });
          const sortedIds = ['g_class3', 'g_class6', 'g_class7', 'g_class11'];
          s.groups.forEach(g => {
            if (sortedIds.includes(g.id)) g.names.sort(collator.compare);
          });
          s.version = 6;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        }
        return s;
      }
    }
  } catch (e) { console.warn('读取本地数据失败', e); }
  return {
    groups: [
      { id: 'g_class3', name: '高一3班', names: class3, removed: [] },
      { id: 'g_class6', name: '高一6班', names: class6, removed: [] },
      { id: 'g_class7', name: '高一7班', names: class7, removed: [] },
      { id: 'g_class11', name: '高一11班', names: class11, removed: [] }
    ],
    selectedId: 'g_class7'
  };
}
function saveStore() { localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.assign({}, store, { version: 6 }))); }

function getSelectedGroup() {
  return store.groups.find(g => g.id === store.selectedId) || null;
}
// 当前可选人员（未被移除的）
function availableNames(g) {
  if (!g) return [];
  const removed = new Set(g.removed || []);
  return g.names.filter(n => !removed.has(n));
}

// -------------------- Three.js 场景初始化 --------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.008);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 38);

// 轨道控制器：拖拽旋转 + 滚轮缩放
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 18;
controls.maxDistance = 80;
controls.enablePan = false;
controls.autoRotate = false;

// 灯光
scene.add(new THREE.AmbientLight(0x8899cc, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 10, 20);
scene.add(dirLight);
const blueLight = new THREE.PointLight(0x4488ff, 1.2, 100);
blueLight.position.set(-15, 5, 15);
scene.add(blueLight);

// 球体半径
const SPHERE_R = 14;

// 装球体与名字的分组，便于整体旋转做抽签动画
const earthGroup = new THREE.Group();
scene.add(earthGroup);

// ---- 极淡的球面壳：作为"球"的边界参考，让弧线看起来贴在球面上 ----
const sphereGeo = new THREE.SphereGeometry(SPHERE_R, 64, 64);
const sphereMat = new THREE.MeshBasicMaterial({
  color: 0x2a4a7a,
  transparent: true,
  opacity: 0.12,
  side: THREE.DoubleSide,
  depthWrite: false
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
earthGroup.add(sphere);

// ---- 星空（Shader 单颗闪烁） ----
function createStars(count, radiusMin, radiusMax, size) {
  const positions = new Float32Array(count * 3);
  const phases = new Float32Array(count);   // 闪烁相位
  const speeds = new Float32Array(count);   // 闪烁速度
  for (let i = 0; i < count; i++) {
    // 球壳上随机分布
    const r = radiusMin + Math.random() * (radiusMax - radiusMin);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
    phases[i] = Math.random() * Math.PI * 2;
    speeds[i] = 0.5 + Math.random() * 2.0;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
  geo.setAttribute('speed', new THREE.BufferAttribute(speeds, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uSize: { value: size },
      uColor: { value: new THREE.Color(0x9aa8c8) }
    },
    vertexShader: `
      attribute float phase;
      attribute float speed;
      uniform float uTime;
      uniform float uSize;
      varying float vAlpha;
      void main() {
        // 闪烁幅度收窄：0.55 ~ 0.85，不再忽明忽暗
        vAlpha = 0.55 + 0.30 * (0.5 + 0.5 * sin(uTime * speed + phase));
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = uSize * (300.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      varying float vAlpha;
      void main() {
        float d = distance(gl_PointCoord, vec2(0.5));
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * vAlpha;
        gl_FragColor = vec4(uColor, a);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  return points;
}
const stars1 = createStars(1200, 80, 200, 1.6);
const stars2 = createStars(400,  150, 350, 2.4);

// -------------------- 名字标签（Sprite） --------------------
/**
 * 用 Canvas 生成一张带名字的纹理，做成 Sprite 贴在球面。
 * @param {string} name 名字
 * @param {boolean} highlight 是否高亮（抽中时）
 */
function makeNameSprite(name, highlight = false) {
  const fontSize = 48;
  const padX = 28, padY = 14;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `600 ${fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
  const w = Math.ceil(ctx.measureText(name).width) + padX * 2;
  const h = fontSize + padY * 2;
  // 放大 2 倍提升清晰度（大屏投影不糊）
  const scale = 2;
  c.width = w * scale;
  c.height = h * scale;
  ctx.scale(scale, scale);
  ctx.font = `600 ${fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 文字：半透明白色，不突兀
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.fillStyle = highlight ? '#ffd98a' : 'rgba(232, 237, 245, 0.6)';
  ctx.fillText(name, w / 2, h / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const mat = new THREE.SpriteMaterial({
    map: tex,
    transparent: true,
    depthWrite: false
  });
  const sprite = new THREE.Sprite(mat);
  // 精灵大小按宽高比设定
  const aspect = w / h;
  const baseH = highlight ? 2.6 : 1.6;
  sprite.scale.set(baseH * aspect, baseH, 1);
  return sprite;
}

/**
 * 生成一个干净的实心小圆点（星链节点）——不发光、不辉光，就是个小白点
 * @param {boolean} highlight 高亮时变暖金色、变大
 */
function makeDotMesh(highlight = false) {
  const geo = new THREE.SphereGeometry(highlight ? 0.18 : 0.1, 12, 12);
  const mat = new THREE.MeshBasicMaterial({
    color: highlight ? 0xffd98a : 0x9fb4d8
  });
  return new THREE.Mesh(geo, mat);
}

// 当前所有节点：{ name, sprite, dot, position }
let nameNodes = [];
// 连线对象（一个 LineSegments），重建时整体 dispose
let edgeLines = null;

/** 清掉所有旧节点和连线 */
function clearNodes() {
  nameNodes.forEach(node => {
    earthGroup.remove(node.sprite);
    node.sprite.material.map.dispose();
    node.sprite.material.dispose();
    earthGroup.remove(node.dot);
    node.dot.geometry.dispose();
    node.dot.material.dispose();
  });
  nameNodes = [];
  if (edgeLines) {
    earthGroup.remove(edgeLines);
    edgeLines.geometry.dispose();
    edgeLines.material.dispose();
    edgeLines = null;
  }
}

/** 根据节点列表，找最近邻，沿球面大圆弧线连起来（只连紧邻点，不跨球） */
function buildEdges(nodes) {
  if (nodes.length < 2) return;
  const K = 10; // 每个点最多连 10 个最近邻（人数 ≤11 时全连接）
  const SEGMENTS = 12;
  const positions = [];
  const seen = new Set();

  const unit = nodes.map(n => n.position.clone().normalize());

  for (let i = 0; i < nodes.length; i++) {
    const dists = [];
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      dists.push({ j, d: nodes[i].position.distanceToSquared(nodes[j].position) });
    }
    dists.sort((a, b) => a.d - b.d);

    for (let k = 0; k < Math.min(K, dists.length); k++) {
      const j = dists[k].j;
      const key = i < j ? `${i}-${j}` : `${j}-${i}`;
      if (seen.has(key)) continue;

      const omega = Math.acos(Math.min(1, Math.max(-1, unit[i].dot(unit[j]))));
      if (omega < 1e-5) continue;

      seen.add(key);
      const a = unit[i], b = unit[j];
      const sinOmega = Math.sin(omega);

      let prev = a.clone().multiplyScalar(SPHERE_R);
      for (let s = 1; s <= SEGMENTS; s++) {
        const t = s / SEGMENTS;
        const p = a.clone().multiplyScalar(Math.sin((1 - t) * omega) / sinOmega)
                  .add(b.clone().multiplyScalar(Math.sin(t * omega) / sinOmega))
                  .multiplyScalar(SPHERE_R);
        positions.push(prev.x, prev.y, prev.z);
        positions.push(p.x, p.y, p.z);
        prev = p;
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  // 弧线虚线：细虚线贴在球面上
  const mat = new THREE.LineDashedMaterial({
    color: 0xb8cce8,
    transparent: true,
    opacity: 0.5,
    dashSize: 0.45,
    gapSize: 0.3,
    depthWrite: false
  });
  edgeLines = new THREE.LineSegments(geo, mat);
  edgeLines.computeLineDistances();
  earthGroup.add(edgeLines);
}

/** 把名字均匀分布到球面（斐波那契螺旋），同时建节点点和连线 */
function buildNameSprites(names) {
  clearNodes();

  const n = names.length;
  if (n === 0) return;
  const golden = Math.PI * (3 - Math.sqrt(5)); // 黄金角
  const Y_LIMIT = 0.93; // 只避开最顶端/最底端一点，其余球面都分布名字
  for (let i = 0; i < n; i++) {
    const y = Y_LIMIT - (i / (n - 1)) * 2 * Y_LIMIT; // y: 0.82 -> -0.82
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = golden * i;
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;
    // 节点放在球面位置（连线附着在球面壳上）
    const pos = new THREE.Vector3(
      x * SPHERE_R,
      y * SPHERE_R,
      z * SPHERE_R
    );

    // 文字标签：稍微外凸一点，避免和节点点重叠
    const sprite = makeNameSprite(names[i], false);
    sprite.position.set(x * (SPHERE_R + 1.2), y * (SPHERE_R + 1.2), z * (SPHERE_R + 1.2));
    sprite.userData.name = names[i];

    // 实心节点点：放在球面壳上
    const dot = makeDotMesh(false);
    dot.position.copy(pos);

    earthGroup.add(sprite);
    earthGroup.add(dot);
    nameNodes.push({ name: names[i], sprite, dot, position: pos });
  }

  // 建相邻节点虚线
  buildEdges(nameNodes);
}

/** 高亮选中名字：文字和节点点都变金色、变大 */
function highlightName(targetName) {
  nameNodes.forEach(node => {
    const on = node.name === targetName;
    // 重建文字
    earthGroup.remove(node.sprite);
    node.sprite.material.map.dispose();
    node.sprite.material.dispose();
    node.sprite = makeNameSprite(node.name, on);
    // 文字标签位置保持外凸距离
    const p = node.position;
    const len = p.length();
    node.sprite.position.set(p.x / len * (SPHERE_R + 1.2), p.y / len * (SPHERE_R + 1.2), p.z / len * (SPHERE_R + 1.2));
    earthGroup.add(node.sprite);
    // 重建节点点（Mesh）
    earthGroup.remove(node.dot);
    node.dot.geometry.dispose();
    node.dot.material.dispose();
    node.dot = makeDotMesh(on);
    node.dot.position.copy(node.position);
    earthGroup.add(node.dot);
  });
}

/** 清除高亮，恢复普通样式 */
function clearHighlight() {
  highlightName(null);
}

// -------------------- UI：左侧分组列表 --------------------
const groupListEl = document.getElementById('groupList');
const btnNew = document.getElementById('btnNew');
const btnEdit = document.getElementById('btnEdit');
const btnDel = document.getElementById('btnDel');
const btnReset = document.getElementById('btnReset');
const chkRemove = document.getElementById('chkRemove');

function renderGroupList() {
  groupListEl.innerHTML = '';
  // 按组名排序
  const sorted = [...store.groups].sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  sorted.forEach(g => {
    const available = availableNames(g).length;
    const item = document.createElement('div');
    item.className = 'group-item' + (g.id === store.selectedId ? ' active' : '');
    item.innerHTML = `
      <input type="radio" name="grp" ${g.id === store.selectedId ? 'checked' : ''}>
      <span class="gname"></span>
      <span class="gcount">${available}人</span>
    `;
    item.querySelector('.gname').textContent = `${g.name}`;
    item.onclick = () => {
      store.selectedId = g.id;
      saveStore();
      renderGroupList();
      loadSelectedGroup();
    };
    groupListEl.appendChild(item);
  });
  // 按钮可用性
  const has = !!getSelectedGroup();
  btnEdit.disabled = !has;
  btnDel.disabled = !has;
}

/** 选中分组后：把可用名字加载到球面 */
function loadSelectedGroup() {
  const g = getSelectedGroup();
  const names = g ? availableNames(g) : [];
  buildNameSprites(names);
  document.getElementById('winner').textContent = '?';
  document.getElementById('winner').classList.remove('show');
}

// -------------------- 编辑弹窗 --------------------
const modalMask = document.getElementById('modalMask');
const modalTitle = document.getElementById('modalTitle');
const groupNameInput = document.getElementById('groupNameInput');
const namesTextarea = document.getElementById('namesTextarea');
const modalCount = document.getElementById('modalCount');
const btnSave = document.getElementById('saveBtn');
const btnCancel = document.getElementById('cancelBtn');
let editingId = null; // null 表示新建

function openModal(group) {
  editingId = group ? group.id : null;
  modalTitle.textContent = group ? '编辑名单组' : '新建名单组';
  groupNameInput.value = group ? group.name : '';
  namesTextarea.value = group ? group.names.join('\n') : '';
  updateModalCount();
  modalMask.classList.add('show');
  groupNameInput.focus();
}
function closeModal() { modalMask.classList.remove('show'); editingId = null; }
function updateModalCount() {
  const arr = namesTextarea.value.split('\n').map(s => s.trim()).filter(Boolean);
  modalCount.textContent = `共 ${arr.length} 人`;
}
namesTextarea.addEventListener('input', updateModalCount);

btnNew.onclick = () => openModal(null);
btnEdit.onclick = () => { const g = getSelectedGroup(); if (g) openModal(g); };
btnCancel.onclick = closeModal;

btnSave.onclick = () => {
  const name = (groupNameInput.value.trim() || '未命名组').slice(0, 6);
  const names = namesTextarea.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (names.length === 0) { toast('请至少填写一个名字'); return; }

  if (editingId) {
    const g = store.groups.find(x => x.id === editingId);
    // 保留已移除记录里仍存在的人
    const oldRemoved = new Set(g.removed || []);
    g.name = name;
    g.names = names;
    g.removed = names.filter(n => oldRemoved.has(n));
  } else {
    const id = 'g_' + Date.now();
    store.groups.push({ id, name, names, removed: [] });
    store.selectedId = id;
  }
  saveStore();
  closeModal();
  renderGroupList();
  loadSelectedGroup();
  toast('已保存');
};

btnDel.onclick = () => {
  const g = getSelectedGroup();
  if (!g) return;
  if (!confirm(`确定删除「${g.name}」吗？此操作不可恢复。`)) return;
  store.groups = store.groups.filter(x => x.id !== g.id);
  if (store.selectedId === g.id) {
    store.selectedId = store.groups[0] ? store.groups[0].id : null;
  }
  saveStore();
  renderGroupList();
  loadSelectedGroup();
};

btnReset.onclick = () => {
  const g = getSelectedGroup();
  if (!g) return;
  g.removed = [];
  saveStore();
  renderGroupList();
  loadSelectedGroup();
  toast('已恢复全部人员');
};

// -------------------- Toast --------------------
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

// -------------------- 抽签逻辑 --------------------
const drawBtn = document.getElementById('drawBtn');
const winnerEl = document.getElementById('winner');

let drawing = false;
// 旋转状态机
const spin = {
  speed: 0,           // 当前 y 轴角速度
  phase: 'idle',      // idle | accel | decel | done
  elapsed: 0,         // 本阶段已用时间
  duration: 0,        // 本阶段总时长
  targetY: 0,         // 减速结束后要转到的目标 y 角度
  targetX: 0,
  pickedName: null
};

drawBtn.onclick = startDraw;

function startDraw() {
  if (drawing) return;
  const g = getSelectedGroup();
  if (!g) { toast('请先新建或选择一个名单组'); return; }
  const pool = availableNames(g);
  if (pool.length === 0) { toast('本组已抽完，点"重置本组"恢复人员'); return; }

  drawing = true;
  drawBtn.disabled = true;
  drawBtn.textContent = '抽签中...';
  winnerEl.classList.remove('show');
  winnerEl.textContent = '?';
  clearHighlight();

  // 随机选中一人
  const idx = Math.floor(Math.random() * pool.length);
  const picked = pool[idx];
  spin.pickedName = picked;

  // 计算：把该名字转到正对相机（z 轴正方向）需要的 group 旋转
  const node = nameNodes.find(n => n.name === picked);
  if (node) {
    const p = node.position.clone(); // 球面局部坐标
    const thetaY = Math.atan2(p.x, p.z);
    // 俯仰角：atan(y / sqrt(x²+z²)) 才是正确的绕 X 轴角度
    const horiz = Math.sqrt(p.x * p.x + p.z * p.z);
    const phiX = Math.atan2(p.y, horiz);
    spin.targetY = -thetaY;
    spin.targetX = phiX;
  } else {
    spin.targetY = earthGroup.rotation.y;
    spin.targetX = earthGroup.rotation.x;
  }

  // 加速阶段：先快速转 2.2 秒
  spin.phase = 'accel';
  spin.elapsed = 0;
  spin.duration = 2.2;
  spin.speed = 0.02; // 起步速度
}

/** 抽签动画每一帧推进 */
function tickSpin(dt) {
  if (spin.phase === 'idle') {
    // 空闲低速自转
    earthGroup.rotation.y += 0.0015;
    return;
  }

  spin.elapsed += dt;
  const t = Math.min(spin.elapsed / spin.duration, 1);

  if (spin.phase === 'accel') {
    // 只绕 Y 轴高速旋转，保持 X/Z 不参与翻滚，便于减速对准
    spin.speed = 0.02 + t * 0.4;
    earthGroup.rotation.y += spin.speed;
    if (t >= 1) {
      spin.phase = 'decel';
      spin.elapsed = 0;
      spin.duration = 1.8;
    }
  } else if (spin.phase === 'decel') {
    // 缓动减速，从当前 Y 角度多转两圈后停到目标
    const ease = 1 - Math.pow(1 - t, 3);
    const curY = earthGroup.rotation.y;
    const curX = earthGroup.rotation.x;
    const extraTurns = Math.PI * 4;
    const goalY = normalizeAngle(curY, spin.targetY) + extraTurns;
    const goalX = spin.targetX;
    earthGroup.rotation.y = curY + (goalY - curY) * ease;
    earthGroup.rotation.x = curX + (goalX - curX) * ease;

    if (t >= 1) {
      earthGroup.rotation.y = goalY;
      earthGroup.rotation.x = goalX;
      finishDraw();
    }
  }
}

/** 把 target 角度归一化为 current 附近的等价角（最短路径方向上 + 多圈） */
function normalizeAngle(current, target) {
  // 让 target 落在 current 之后（更大值）的等价角
  let t = target;
  while (t < current) t += Math.PI * 2;
  return t;
}

function finishDraw() {
  spin.phase = 'done';
  drawing = false;
  drawBtn.disabled = false;
  drawBtn.textContent = '开始抽签';

  const picked = spin.pickedName;
  // 高亮球面名字（球上直接展示，不在底部重复）
  highlightName(picked);

  // 语音朗读
  speakName(picked);

  // 抽中后移除：仅当未勾选"重复抽取"时才移除
  const g = getSelectedGroup();
  if (g && !chkRemove.checked) {
    g.removed = g.removed || [];
    g.removed.push(picked);
    saveStore();
    renderGroupList();
    setTimeout(() => {
      // 从节点列表摘掉该人：同时移除文字标签和发光点
      const idx = nameNodes.findIndex(n => n.name === picked);
      if (idx >= 0) {
        const node = nameNodes[idx];
        earthGroup.remove(node.sprite);
        node.sprite.material.map.dispose();
        node.sprite.material.dispose();
        earthGroup.remove(node.dot);
        node.dot.geometry.dispose();
        node.dot.material.dispose();
        nameNodes.splice(idx, 1);
        // 节点变了，重建连线
        if (edgeLines) {
          earthGroup.remove(edgeLines);
          edgeLines.geometry.dispose();
          edgeLines.material.dispose();
          edgeLines = null;
        }
        buildEdges(nameNodes);
      }
    }, 3000);
  }
}

/** 浏览器语音朗读名字 */
function speakName(name) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(name);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    u.pitch = 1.0;
    speechSynthesis.speak(u);
  } catch (e) { console.warn('语音朗读失败', e); }
}

// -------------------- 面板开关 --------------------
const btnClosePanel = document.getElementById('btnClosePanel');
const btnOpenPanel = document.getElementById('btnOpenPanel');
const btnResetCache = document.getElementById('btnResetCache');
const panelEl = document.getElementById('panel');

btnClosePanel.onclick = () => {
  panelEl.style.display = 'none';
  btnOpenPanel.style.display = 'block';
};
btnOpenPanel.onclick = () => {
  panelEl.style.display = 'flex';
  btnOpenPanel.style.display = 'none';
};
btnResetCache.onclick = () => {
  if (confirm('确定要重置名单缓存并重新加载页面吗？已编辑的名单与抽签记录将恢复为默认。')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
};

// -------------------- 全屏 + 鼠标静止隐藏 UI --------------------
const btnFullscreen = document.getElementById('btnFullscreen');
btnFullscreen.onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
};

const uiEls = [document.getElementById('panel'), document.getElementById('bottom'), document.getElementById('topRight')];
let hideTimer = null;
function wakeUI() {
  uiEls.forEach(el => el.classList.remove('hidden-ui'));
  clearTimeout(hideTimer);
  // 全屏状态下：3 秒无操作自动隐藏控制面板（保留结果大字？按需求整体隐藏控制面板）
  if (document.fullscreenElement) {
    hideTimer = setTimeout(() => {
      // 抽签进行中不隐藏
      if (!drawing) uiEls.forEach(el => el.classList.add('hidden-ui'));
    }, 3000);
  }
}
window.addEventListener('mousemove', wakeUI);
window.addEventListener('touchstart', wakeUI);
document.addEventListener('fullscreenchange', wakeUI);

// -------------------- 窗口尺寸自适应 --------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// -------------------- 主渲染循环 --------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // 星星闪烁时间
  stars1.material.uniforms.uTime.value = t;
  stars2.material.uniforms.uTime.value = t;

  // 球体抽签/自转
  tickSpin(dt);

  controls.update();
  renderer.render(scene, camera);
}

// -------------------- 启动 --------------------
renderGroupList();
loadSelectedGroup();
animate();
wakeUI();
</script>
